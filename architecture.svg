<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="14">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475467"/></marker></defs>
  <rect width="920" height="640" fill="#ffffff"/>
  <g stroke="#475467" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M460 86V116"/><path d="M460 176V206"/>
    <path d="M460 236C460 262 160 250 160 290"/><path d="M460 236V290"/><path d="M460 236C460 262 760 250 760 290"/>
    <path d="M160 392C160 420 440 410 440 440"/><path d="M460 392V440"/><path d="M760 392C760 420 480 410 480 440"/>
    <path d="M460 500V526"/><path d="M460 586V606" stroke-dasharray="5 4"/>
    <path d="M610 470H700" stroke-dasharray="5 4"/>
  </g>
  <g text-anchor="middle">
    <rect x="310" y="40" width="300" height="46" rx="10" fill="#f2f4f7" stroke="#98a2b3"/><text x="460" y="68">Customer message (typed, or a review from the CSV)</text>
    <rect x="310" y="116" width="300" height="60" rx="10" fill="#fffaeb" stroke="#f79009"/><text x="460" y="142" font-weight="600">Input gate: PII redaction</text><text x="460" y="162" font-size="12" fill="#667085">PAN, Aadhaar, account, phone, email, OTP removed first</text>
    <text x="460" y="226" font-size="12" fill="#667085">redacted text only &#8594; three agents, in parallel, none reads another</text>
    <rect x="40" y="290" width="240" height="102" rx="10" fill="#ecfdf3" stroke="#12b76a"/><text x="160" y="316" font-weight="600">Facts Agent</text><text x="160" y="338" font-size="12" fill="#344054">Milestone 1 corpus (74 facts, 16 pages)</text><text x="160" y="356" font-size="12" fill="#344054">one fact + one citation link,</text><text x="160" y="374" font-size="12" fill="#344054">or "not covered" + what was searched</text>
    <rect x="340" y="290" width="240" height="102" rx="10" fill="#eff8ff" stroke="#2e90fa"/><text x="460" y="316" font-weight="600">Pattern Agent</text><text x="460" y="338" font-size="12" fill="#344054">Milestone 2 themes + reviews CSV</text><text x="460" y="356" font-size="12" fill="#344054">one-off / recurring / rising,</text><text x="460" y="374" font-size="12" fill="#344054">review count + 28-day window</text>
    <rect x="640" y="290" width="240" height="102" rx="10" fill="#fef3f2" stroke="#f04438"/><text x="760" y="316" font-weight="600">Compliance Agent</text><text x="760" y="338" font-size="12" fill="#344054">incoming: PII found, advice asked</text><text x="760" y="356" font-size="12" fill="#344054">outgoing draft: advice, return claims,</text><text x="760" y="374" font-size="12" fill="#344054">PII (called by the reviewer)</text>
    <rect x="300" y="440" width="320" height="60" rx="10" fill="#f4f3ff" stroke="#7a5af8"/><text x="460" y="466" font-weight="600">Orchestrator</text><text x="460" y="486" font-size="12" fill="#344054">reply &#8804;3 sentences + citation + last checked | routing note</text>
    <rect x="700" y="446" width="190" height="48" rx="10" fill="#fffaeb" stroke="#f79009"/><text x="795" y="467" font-size="12" font-weight="600">Disagreement &#8594; HOLD</text><text x="795" y="483" font-size="11" fill="#344054">Facts clean + Pattern rising: do not close</text>
    <rect x="300" y="526" width="320" height="60" rx="10" fill="#fef3f2" stroke="#f04438"/><text x="460" y="552" font-weight="600">Reviewer (hard fails)</text><text x="460" y="572" font-size="12" fill="#344054">uncited claim, advice, return claim, PII &#8594; 1 rework, then flag</text>
    <text x="460" y="624" font-size="12.5" fill="#344054">Human: refine (max 5, only affected agents re-run) &#8594; APPROVE &#8594; MCP: append record + email draft (never sent)</text>
  </g>
</svg>
